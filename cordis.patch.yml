# dsh-terraria-skin bundle patch: inserts its plugin row into the web plugin
# roster. The plugin is pure-client: the single row's browser half is served
# from this package's lib/client.js (the package.json `dsh.client` manifest
# declares it for the modules node half that scans dsh.client packages).
# Install into a dsh profile with:
#   dsh plugin --profile web add link:./dsh-terraria-skin
#   (or `add dsh-terraria-skin` once published to npm)
- insert:
    - id: terraria-skin
      name: 'dsh-terraria-skin'
